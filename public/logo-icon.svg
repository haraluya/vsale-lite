<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- V 字母與購物車組合 Logo (圖示版) -->

  <!-- V 字母 -->
  <path d="M5 10 L20 50 L35 10"
        stroke="#000"
        stroke-width="4"
        fill="none"
        stroke-linejoin="miter"/>

  <!-- 購物車主體 -->
  <rect x="25" y="25"
        width="30"
        height="20"
        stroke="#000"
        stroke-width="4"
        fill="#1E40AF"/>

  <!-- 購物車把手 -->
  <path d="M55 25 L60 20 L60 15"
        stroke="#000"
        stroke-width="4"
        fill="none"
        stroke-linecap="square"/>

  <!-- 購物車輪子 -->
  <circle cx="33" cy="50" r="4" fill="#000"/>
  <circle cx="47" cy="50" r="4" fill="#000"/>
</svg>
